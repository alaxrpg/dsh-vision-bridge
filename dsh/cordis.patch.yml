# dsh-vision-bridge bundle patch
#
# 通过 `dsh plugin --profile <name> add dsh-vision-bridge` 安装时,该声明会把
# 本包追加进 dsh.profile.bundles,profile 启动时合并此 patch(单一 insert 行)。
# 手动安装(pnpm + cordis.patch.yml 手挂)时请勿重复挂载,避免双实例。
#
# 可选的行内 config(优先级低于 settings.yaml 的 vision-bridge 段):
#
#   - insert:
#       - id: vision-bridge
#         name: dsh-vision-bridge
#         config:
#           provider: sensennova
#           timeout: 90
- insert:
    - id: vision-bridge
      name: dsh-vision-bridge
